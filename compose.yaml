services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: disputepilot
      POSTGRES_USER: disputepilot
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dispute-pilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disputepilot"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  dispute-pilot-db:
